# .github/workflows/pkgdown.yaml
#
# Builds the website and publishes it to the gh-pages branch on every push to
# main. The tutorials really run here, so each build installs SeuratData and
# downloads both public test datasets. A failed build publishes nothing, and the
# live site stays as it was.
#
# To test a build without publishing it, start this workflow by hand from the
# Actions tab on any other branch.

on:
  push:
    branches: [main]
  workflow_dispatch:

name: pkgdown

jobs:
  pkgdown:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}  # auto-generated per run

    permissions:
      contents: write                          # lets the last step publish

    steps:
      # Step 1: clone the repository onto the runner machine
      - uses: actions/checkout@v4

      # Step 2: install Pandoc (builds the pages) and R
      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Step 3: install this package, everything in DESCRIPTION, and the tools
      #   the website needs
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgdown
            any::remotes
            any::Seurat
            local::.

      # Step 4: install SeuratData and download the test datasets
      #   SeuratData isn't on CRAN, so it comes from GitHub. It gets its own step
      #   because Step 3 would also require Azimuth, an optional SeuratData
      #   package that isn't on CRAN or Bioconductor.
      - name: Install SeuratData and test datasets
        run: |
          remotes::install_github("satijalab/seurat-data", upgrade = "never")
          SeuratData::InstallData(c("stxBrain", "ifnb"))
        shell: Rscript {0}

      # Step 5: build the site
      #   pkgdown turns every Markdown file in the top folder into a page, so
      #   the project notes in CLAUDE.md are removed from this checkout first.
      - name: Build site
        run: |
          file.remove("CLAUDE.md")
          pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      # Step 6: publish, from main only
      - name: Publish to gh-pages
        if: github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          clean: false
          branch: gh-pages
          folder: docs
