# .github/workflows/R-CMD-check.yaml
#
# Runs R CMD check on every push to dev/main and on pull requests.
# Runs on macOS (primary dev platform), Windows and Ubuntu with R release, and
# on Ubuntu with R-devel, which CRAN also checks against. The Ubuntu release
# job also builds the PDF manual and validates the HTML manual; the others skip
# these to avoid installing the extra tools. The dependency step installs both
# CRAN and Bioconductor packages (rhdf5, OmnipathR).

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false   # if macOS fails, Ubuntu still runs (you see both results)
      matrix:
        config:
          - {os: macos-latest,   r: 'release', args: 'c("--no-manual", "--as-cran")'}
          - {os: windows-latest, r: 'release', args: 'c("--no-manual", "--as-cran")'}
          - {os: ubuntu-latest,  r: 'release', args: 'c("--as-cran")', manual-checks: true, extra-packages: 'any::V8'}
          - {os: ubuntu-latest,  r: 'devel',  args: 'c("--no-manual", "--as-cran")', http-user-agent: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}  # auto-generated per run; lets
                                                # the runner read private repos
      R_KEEP_PKG_SOURCE: yes                   # improves error messages
      OMP_THREAD_LIMIT: 2                      # same two-thread limit as CRAN

    steps:
      # Step 1: clone the repository onto the runner machine
      - uses: actions/checkout@v4

      # Step 2: install R (version comes from the matrix above)
      #   use-public-rspm: true  →  Posit's binary package mirror; Linux
      #   packages install in seconds instead of compiling from source
      #   http-user-agent  →  lets R-devel use the same binary packages
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      # Pandoc builds the vignettes
      - uses: r-lib/actions/setup-pandoc@v2

      # Step 3: install tools for the PDF and HTML manual checks (one job only)
      #   LaTeX builds the PDF manual; tidy validates the HTML one
      - uses: r-lib/actions/setup-tinytex@v2
        if: matrix.config.manual-checks

      - name: Install HTML Tidy
        if: matrix.config.manual-checks
        run: |
          sudo apt-get update
          sudo apt-get install -y tidy

      # Step 4: install all packages listed in DESCRIPTION
      #   extra-packages: any::rcmdcheck  →  adds rcmdcheck (used in Step 5);
      #                                      the matrix adds V8 for math checks
      #   needs: check                   →  reads DESCRIPTION; installs Imports
      #                                     and Suggests needed for R CMD check,
      #                                     from CRAN and Bioconductor
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            ${{ matrix.config.extra-packages }}
          needs: check

      # Step 5: run R CMD check
      #   args (from the matrix above):
      #     --no-manual →  skip PDF manual (requires LaTeX; slow on CI)
      #     --as-cran   →  apply CRAN-level strictness
      #   error-on: '"warning"'  →  fail the workflow on any warning, not just errors
      #   upload-snapshots: true →  save check output as a downloadable artifact
      #                             so you can read failures in the Actions tab
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: ${{ matrix.config.args }}
          error-on: '"warning"'
          upload-snapshots: true
